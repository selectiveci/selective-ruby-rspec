name: Multi Ruby/RSpec Matrix

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      without_selective:
        description: Run plain rspec, as a fork PR without secrets would
        type: boolean
        default: false

jobs:
  multi-ruby-rspec:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} - RSpec ${{ matrix.rspec }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "2.7"
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0.7"
        rspec:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        experimental: [false]
        include:
          - { ruby: "3.0", rspec: "4.0", experimental: true }
          - { ruby: "3.1", rspec: "4.0", experimental: true }
          - { ruby: "3.2", rspec: "4.0", experimental: true }
          - { ruby: "3.3", rspec: "4.0", experimental: true }
          - { ruby: "3.4", rspec: "4.0", experimental: true }
          - { ruby: "4.0.7", rspec: "4.0", experimental: true }

    env:
      BUNDLE_GEMFILE: gemfiles/rspec_${{ matrix.rspec }}.gemfile
      WITHOUT_SELECTIVE: ${{ inputs.without_selective || secrets.SELECTIVE_API_KEY == '' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "${{ matrix.ruby }}"
          bundler-cache: true

      - name: Setup Selective
        if: env.WITHOUT_SELECTIVE != 'true'
        uses: selectiveci/setup-selective@v1
        with:
          api-key: ${{ secrets.SELECTIVE_API_KEY }}
          runner-id: "0"

      - name: Run the specs
        shell: bash
        env:
          SELECTIVE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.ruby }}-${{ matrix.rspec }}
        run: |
          if [[ "$WITHOUT_SELECTIVE" == "true" ]]; then
            env -u SELECTIVE_API_KEY bundle exec rspec --exclude-pattern spec/hooks_spec.rb 2>&1 | tee rspec-output.log
            bundle exec rspec --dry-run --exclude-pattern spec/hooks_spec.rb > rspec-dry-run.log 2>&1
          else
            bundle exec selective rspec 2>&1 | tee rspec-output.log
            bundle exec rspec --dry-run > rspec-dry-run.log 2>&1
          fi

      - name: Fail unless the whole suite ran
        shell: bash
        run: |
          count() { grep -aoE '^[0-9]+ examples?, ' "$1" | tail -n 1 | grep -oE '^[0-9]+' || true; }
          ran=$(count rspec-output.log)
          suite=$(count rspec-dry-run.log)
          echo "ran ${ran:-no} of a ${suite:-unknown}-example suite"
          [[ -n "$ran" && -n "$suite" && "$suite" -gt 0 && "$ran" == "$suite" ]]
