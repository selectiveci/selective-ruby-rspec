name: Multi Ruby/RSpec Matrix

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  multi-ruby-rspec:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} - RSpec ${{ matrix.rspec }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "2.7"
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0.7"
        rspec:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        experimental: [false]
        include:
          - { ruby: "3.0", rspec: "4.0", experimental: true }
          - { ruby: "3.1", rspec: "4.0", experimental: true }
          - { ruby: "3.2", rspec: "4.0", experimental: true }
          - { ruby: "3.3", rspec: "4.0", experimental: true }
          - { ruby: "3.4", rspec: "4.0", experimental: true }
          - { ruby: "4.0.7", rspec: "4.0", experimental: true }

    env:
      BUNDLE_GEMFILE: gemfiles/rspec_${{ matrix.rspec }}.gemfile

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "${{ matrix.ruby }}"
          bundler-cache: true

      - name: Setup Selective
        uses: selectiveci/setup-selective@v1
        with:
          api-key: ${{ secrets.SELECTIVE_API_KEY }}
          runner-id: "0"

      - name: Run the specs
        env:
          SELECTIVE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.ruby }}-${{ matrix.rspec }}
        run: bundle exec selective rspec | tee rspec-output.log

      - name: Fail if no examples ran
        run: grep -E "^[1-9][0-9]* examples?, " rspec-output.log
