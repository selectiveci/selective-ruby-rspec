name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  # Prepares Selective's test selection for this commit and asks how many
  # runners the selected tests need, up to the usual 4.
  plan:
    runs-on: ubuntu-24.04
    name: Plan runners
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - name: Plan runners
        id: plan
        uses: selectiveci/setup-selective/plan@v1
        with:
          api-key: ${{ secrets.SELECTIVE_API_KEY }}
          max-runners: 4

  selective:
    needs: [plan]
    runs-on: ubuntu-24.04
    name: Selective (runner ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Setup Selective
        uses: selectiveci/setup-selective@v1
        with:
          api-key: ${{ secrets.SELECTIVE_API_KEY }}
          runner-id: ${{ matrix.runner }}

      - name: Run the default task
        run: bundle exec selective rspec

      - name: Store logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.runner }}
          path: ./log/*.log

  # The number of runners changes from build to build, so branch protection
  # requires this job rather than each runner.
  selective-passed:
    needs: [selective]
    if: always()
    runs-on: ubuntu-24.04
    name: Selective
    steps:
      - run: test "${{ needs.selective.result }}" = success
