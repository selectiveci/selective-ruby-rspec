version: v1.0
name: Ruby
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
blocks:
  - name: Run RSpec tests
    task:
      jobs:
        - name: Run RSpec tests
          parallelism: 2
          commands:
            - sem-version ruby 3.4.5
            - checkout
            - bundle install
            - bundle exec selective rspec
      secrets:
        - name: Selective
